# =============================================================================
# openprimus — SIMULATOR config (runs on your PC, no ESP32 needed)
# =============================================================================
# This is a thin entry point. The actual logic lives in modular packages:
#   packages/common.yaml     — fonts, shared state, simulated sensors
#   packages/home_menu.yaml  — Page 1: the brew-mode menu
#   packages/brew_page.yaml  — Page 2: the brewing screen + live updates
#
# Run:  ./scripts/run_sim.sh   (or: esphome run firmware/sim.yaml)
# =============================================================================

esphome:
  name: openprimus-sim
  friendly_name: "openPrimus (simulator)"
  includes:
    - ../experiments/kd360s_snapshot/protocol.h
    - host/sim_capture.h

  on_boot:
    priority: -100
    then:
      - if:
          condition:
            lambda: return getenv("PRIMUS_SIM_SCENARIO") != nullptr;
          then:
            - delay: 1s
            - script.execute: capture_demo

host: {}
logger:
  level: INFO

# ---------------------------------------------------------------------------
# SIMULATED display — SDL2 window on the host
# ---------------------------------------------------------------------------
display:
  - platform: sdl
    id: primus_display
    dimensions:
      width: 360       # WPM Primus circular group-head display (best-known round-panel res)
      height: 360      # confirm exact panel on hardware probe
    window_options:
      position:
        centered_on_display: 0
      resizable: true

# ---------------------------------------------------------------------------
# LVGL top-level (pages come from the packages)
# ---------------------------------------------------------------------------
lvgl:
  displays: [primus_display]
  touchscreens: [sim_touch]
  color_depth: 16
  default_font: font_body

# ---------------------------------------------------------------------------
# Pull in the modular packages
# ---------------------------------------------------------------------------
packages:
  common:    !include packages/common.yaml
  config:    !include packages/config.yaml
  topbar:    !include packages/topbar.yaml
  home_menu: !include packages/home_menu.yaml
  brew_page: !include packages/brew_page.yaml
  chart:     !include packages/chart.yaml
  settings:  !include packages/settings_page.yaml

interval:
  - interval: 100ms
    then:
      - lambda: |-
          primus_sim::capture().observe({id(sim_pressure).state, id(sim_flow_rate).state,
              id(target_pressure).state, NAN, id(brew_active)}, millis());
  - interval: 5ms
    then:
      - lambda: primus_sim::capture().poll(millis());

script:
  - id: capture_demo
    then:
      - globals.set:
          id: current_mode
          value: '"Classic 9 Bar"'
      - lvgl.page.show: brew_page
      - script.execute: brew_toggle
      - delay: 3s
      - script.execute: brew_toggle
      - delay: 1s
      - script.execute: brew_toggle
      - delay: 4s
      - script.execute: brew_back
      - delay: 2s
      - lambda: exit(0);
